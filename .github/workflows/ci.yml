# PagePulse Pro CI Pipeline Trigger
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  # Lint and typecheck - runs fast, catches issues early
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  # Backend tests - unit + integration
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Redis
        run: docker run -d -p 6379:6379 redis:7-alpine

      - name: Build shared types
        run: pnpm --filter=@pagepulse/shared-types run build

      - name: Build backend
        run: pnpm --filter=backend run build

      - name: Run backend tests
        run: pnpm --filter=backend run test
        env:
          REDIS_URL: redis://localhost:6379

  # Frontend tests - unit tests
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter=@pagepulse/shared-types run build

      - name: Run frontend tests
        run: pnpm --filter=page-pulse-frontend run test

  # Build both apps - ensures they compile for production
  build:
    name: Build Apps
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter=@pagepulse/shared-types run build

      - name: Build backend
        run: pnpm --filter=backend run build

      - name: Build frontend
        run: pnpm --filter=page-pulse-frontend run build

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          retention-days: 1

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/.next
          retention-days: 1

  # E2E tests - runs against built apps
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download backend build
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/.next

      - name: Start Redis
        run: docker run -d -p 6379:6379 redis:7-alpine

      - name: Start backend
        run: |
          cd apps/backend
          NODE_ENV=test PORT=3001 node dist/index.js &
          sleep 3

      - name: Start frontend
        run: |
          cd apps/frontend
          NODE_ENV=test PORT=3000 node apps/frontend/server.js &
          sleep 5

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

  # Deploy to Vercel (frontend) - on main branch only
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Deploy backend (example for Railway/Render/Fly.io)
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [build, e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f apps/backend/Dockerfile -t page-pulse-backend .

      - name: Login to container registry
        # Replace with your registry (GHCR, Docker Hub, etc.)
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        run: |
          docker tag page-pulse-backend ghcr.io/${{ github.repository_owner }}/page-pulse-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/page-pulse-backend:${{ github.sha }}
          docker tag page-pulse-backend ghcr.io/${{ github.repository_owner }}/page-pulse-backend:latest
          docker push ghcr.io/${{ github.repository_owner }}/page-pulse-backend:latest